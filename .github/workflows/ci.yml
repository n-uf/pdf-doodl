name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: build / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # turbo caches task outputs locally (.turbo); remote cache optional later
      - name: Build packages
        run: pnpm build:packages

      - name: Typecheck (packages + web)
        run: pnpm typecheck

      - name: Test suite
        run: pnpm test
